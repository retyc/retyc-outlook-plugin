server {
  listen 80 default_server;
  listen [::]:80 default_server;

  root /usr/share/nginx/html;
  server_tokens off;

  # Standard static-file performance knobs.
  sendfile          on;
  tcp_nopush        on;
  tcp_nodelay       on;
  keepalive_timeout 65;

  access_log off;

  # Content-Security-Policy for the task pane document. Built from what the production bundle and
  # office.js actually load — re-check against a fresh build when bumping Nuxt UI or office.js.
  # The API and auth origins below are the prod ones; the Dockerfile rewrites them at image build
  # time from RETYC_API_BASE_URL / RETYC_AUTH_BASE_URL (per-environment images, nothing at runtime).
  set $csp "default-src 'none'";
  # Own bundle + office.js, which pulls its host-specific scripts from the same CDN. The hash is
  # the one-line inline script Nuxt UI injects to drop its bootstrap <style data-nuxt-ui-colors>.
  set $csp "${csp}; script-src 'self' https://appsforoffice.microsoft.com 'sha256-tYCcUbFfjZ9QESuTWESGWrFg2SmiEdyD2MYUfRWUgK0='";
  # Inline styles are unavoidable: splash <style> in taskpane.html, <style> tags injected at
  # runtime by Nuxt UI / reka-ui (theme colors, select viewport), style attribute set by office.js.
  set $csp "${csp}; style-src 'self' 'unsafe-inline'";
  set $csp "${csp}; img-src 'self'";
  # Retyc API, OIDC issuer (discovery, device flow, token endpoint), office.js resource lookups.
  set $csp "${csp}; connect-src 'self' https://api.retyc.com https://auth.retyc.com https://appsforoffice.microsoft.com";
  # Hidden telemetry iframe created by office.js.
  set $csp "${csp}; frame-src https://telemetryservice.firstpartyapps.oaspapps.com";
  # Outlook on the web and new Outlook embed the pane in an iframe; Classic desktop and Mac load
  # it as a top-level document, where frame-ancestors does not apply.
  set $csp "${csp}; frame-ancestors https://outlook.office.com https://outlook.office365.com https://outlook.live.com https://outlook.cloud.microsoft";
  set $csp "${csp}; base-uri 'none'; form-action 'none'";

  # Compression for text-y assets — icons (PNG) are excluded.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Vite code-split chunks carry a content hash in their filename (chunks/[name]-[hash].js).
  # They are truly immutable — cache forever.  ^~ skips regex matching for this prefix.
  location ^~ /chunks/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Entry points: HTML pages + the manifest XML are mutable URLs.
  # No caching — Outlook always pulls a fresh copy when reopening the add-in.
  location ~ \.(html|xml)$ {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Icons are referenced from manifest.xml with stable filenames.
  # Outlook may fetch them cross-origin in some clients → permissive CORS.
  location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Entry JS + CSS — stable (unhashed) filenames, short cache with ETag revalidation.
  location ~ \.(js|css)$ {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = / {
    absolute_redirect off;
    return 302 /taskpane.html;
  }

  # Catch-all: serve as static, otherwise 404.
  location / {
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
}
